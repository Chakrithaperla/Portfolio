<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Neon Rings Gradient -->
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="30%" stop-color="#6366F1" />
      <stop offset="70%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#D9FF72" />
    </linearGradient>

    <!-- Avatar Silhouette Gradient -->
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" />

  <!-- Cyber Grid Lines -->
  <path d="M50 250 H450 M250 50 V450 M110 110 L390 390 M110 390 L390 110" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  
  <!-- Outer Glow Ring -->
  <circle cx="250" cy="250" r="235" stroke="url(#neonRing)" stroke-width="3" fill="none" opacity="0.6" filter="url(#glow)" />
  <circle cx="250" cy="250" r="215" stroke="rgba(124, 58, 237, 0.3)" stroke-width="1" stroke-dasharray="8 6" fill="none" />

  <!-- Stylized Professional Avatar Silhouette -->
  <!-- Head -->
  <circle cx="250" cy="185" r="70" fill="url(#avatarGrad)" stroke="rgba(217, 255, 114, 0.4)" stroke-width="2" />
  
  <!-- Shoulders / Torso -->
  <path d="M120 400 C120 310, 175 280, 250 280 C325 280, 380 310, 380 400 Z" fill="url(#avatarGrad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="2" />

  <!-- Initials Monogram Badge in Center -->
  <rect x="195" y="320" width="110" height="42" rx="12" fill="#030712" stroke="#D9FF72" stroke-width="1.5" filter="url(#glow)" />
  <text x="250" y="347" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC" text-anchor="middle" letter-spacing="3">PC.DEV</text>

  <!-- Orbiting Cyber Dots -->
  <circle cx="250" cy="15" r="6" fill="#D9FF72" filter="url(#glow)" />
  <circle cx="485" cy="250" r="5" fill="#3B82F6" filter="url(#glow)" />
  <circle cx="250" cy="485" r="5" fill="#7C3AED" filter="url(#glow)" />
  <circle cx="15" cy="250" r="5" fill="#6366F1" filter="url(#glow)" />
</svg>
